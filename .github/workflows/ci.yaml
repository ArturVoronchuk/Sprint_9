name: CI

on:
  push:
    branches: [main, develop1]
  pull_request:
    branches: [main, develop1]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Selenoid Chrome image
        run: docker pull selenoid/chrome:128.0

      - name: Start Selenoid via Docker Compose
        run: docker compose up -d selenoid selenoid-ui

      - name: Wait for Selenoid readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenoid is ready"
              exit 0
            fi
            echo "Waiting for Selenoid... ($i)"
            sleep 2
          done
          echo "Selenoid did not start in time"
          exit 1

      - name: Run tests in Docker
        run: docker compose up --build --abort-on-container-exit test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}/allure-results:/app/allure-results" \
                     -v "${{ github.workspace }}/allure-report:/app/allure-report" \
                     frankescobar/allure-docker-service:latest \
                     allure generate /app/allure-results -o /app/allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Stop containers
        if: always()
        run: docker compose down