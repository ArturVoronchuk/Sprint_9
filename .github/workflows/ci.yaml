name: CI

on:
  push:
    branches: [main, develop1]
  pull_request:
    branches: [main, develop1]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify browsers.json exists
        run: |
          echo "=== ls -la selenoid/ ==="
          ls -la selenoid/
          test -f selenoid/browsers.json && echo "OK: browsers.json found" || (echo "ERROR: browsers.json MISSING" && exit 1)

      - name: Create Docker network
        run: docker network create selenoid || true

      - name: Start Selenoid via Docker Compose
        run: docker compose up -d selenoid selenoid-ui

      - name: Debug Selenoid
        if: always()
        run: |
          echo "=== docker ps ==="
          docker ps -a
          echo "=== selenoid logs ==="
          docker logs selenoid || true
          echo "=== status endpoint (/status) ==="
          curl -v http://localhost:4444/status || true
          echo "=== status endpoint (/wd/hub/status) ==="
          curl -v http://localhost:4444/wd/hub/status || true
          echo "=== network inspect ==="
          docker network inspect selenoid || true

      - name: Wait for Selenoid readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4444/wd/hub/status | grep -q '"ready":true'; then
              echo "Selenoid is ready"
              exit 0
            fi
            echo "Waiting for Selenoid... ($i)"
            sleep 2
          done
          echo "Selenoid did not start in time"
          exit 1

      - name: Run tests in Docker
        run: docker compose up --build --abort-on-container-exit test

      - name: Show test logs
        if: always()
        run: docker compose logs test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-report
          docker run --rm \
            -v "${{ github.workspace }}/allure-results:/app/allure-results" \
            -v "${{ github.workspace }}/allure-report:/app/allure-report" \
            frankescobar/allure-docker-service:latest \
            allure generate /app/allure-results -o /app/allure-report --clean || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down